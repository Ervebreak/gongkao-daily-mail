name: Build FC Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install regression-test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Pre-check Python files
        shell: pwsh
        run: |
          python -m py_compile main.py config.py candidate_store.py scripts\validate_daily_brief.py
          if ($LASTEXITCODE -ne 0) { throw "Daily source compilation failed" }
          python -m py_compile agent\fc_entry.py agent\orchestrator.py agent\tools.py agent\confirm.py agent\state.py
          if ($LASTEXITCODE -ne 0) { throw "Agent source compilation failed" }
          python -m py_compile weekly_report.py weekly_typst_export.py fc_weekly_render.py fc_candidate_publish.py scripts\build_weekly_package.py
          if ($LASTEXITCODE -ne 0) { throw "Weekly source compilation failed" }

      - name: Run send-gate, weekly-renderer and deployment regressions
        shell: pwsh
        run: |
          python -m pytest tests/test_agent_state.py tests/test_agent_orchestrator.py tests/test_agent_tool_argument_filtering.py tests/test_initial_draft_contract.py tests/test_llm_client_http_error.py tests/test_morning_gate_drift.py tests/test_fc_weekly_render.py tests/test_build_weekly_package.py tests/test_weekly_typst_export_materials.py tests/test_fc_package_zip.py -q
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }

      - name: Build function.zip
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\build_fc_package.ps1 -OutputZip .\function.zip

      - name: Upload function.zip
        uses: actions/upload-artifact@v4
        with:
          name: function-zip
          path: function.zip
          retention-days: 14
